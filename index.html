<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>api_to_html</title>
</head>
<body class="body">
    <header class="header">
        <div class="header-conatiner">
            <h1>API to HTML</h1>
        </div>
    </header>



    <main class="main">

        <section class="table-section">
            <div class="table-container">
                <table class="table" id="api-table">
                    <caption>
                        Data from API
                    </caption>
                    <colgroup>
                        <col style="width: 8%;">
                        <col style="width: 8%">
                        <col style="width: 25%;">
                        <col style="width: 50%;">
                        <col style="width: 9%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">User ID</th>
                            <th scope="col">Title</th>
                            <th scope="col">Body</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- <tr>
                            <th scope="row" class="id">ooo</th>
                            <td class="userId">ooo</td>
                            <td class="title">ooo</td>
                            <td class="api-body">ooo</td>
                        </tr> -->
                    </tbody>
                </table>
            </div>
        </section>
        <section class="form-section">
            <div class="form-container">
                <form class="form" id="update-form">
                    <label for="form-id">ID:</label><br>
                    <input type="text" id="form-id" name="form-id" disabled="true"><br>
                    <label for="form-userId">User ID:</label><br>
                    <input type="text" id="form-userId" name="form-userId" disabled="true"><br>
                    <label for="form-title">Title:</label><br>
                    <input type="text" id="form-title" name="form-title"><br>
                    <label for="form-body">Body:</label><br>
                    <input type="text" id="form-body" name="form-body"><br><br>
                    <button type="button" id="form-submit-btn" disabled="true">Submit</button>
                </form>
            </div>
        </section>

    </main>


    <footer class="footer">

    </footer>




    <script src="./index.js"></script>
</body>
</html>
